# nginx-rtmp: OBS publishes to rtmp://HOST/live/<channel>?key=<token>. nginx keeps
# <channel> as the stream name and posts key=<token> to the app (on_publish), so
# HLS is served from /hls/<channel>/index.m3u8 without the token ever appearing.
#
# Abuse limits: only the app may approve a publisher, nobody may pull RTMP, idle
# publishers are dropped, connections are capped, and the app polls /stat to drop
# publishers that exceed the configured bitrate or the monthly traffic budget.
worker_processes 1;
error_log /dev/stderr info;
pid /opt/nginx/logs/nginx.pid;

events {
    worker_connections 256;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        max_connections 32;
        max_streams 16;
        max_message 1M;
        timeout 30s;
        ping 30s;
        ping_timeout 10s;
        access_log /dev/stdout;

        application live {
            live on;
            interleave on;
            wait_key on;
            wait_video on;
            drop_idle_publisher 10s;
            idle_streams off;
            play_restart on;
            publish_notify on;
            record off;

            # Only the app decides who may publish; nobody may pull RTMP directly.
            allow publish all;
            deny play all;
            on_publish http://app:4000/internal/stream/publish;
            on_publish_done http://app:4000/internal/stream/done;

            hls on;
            hls_path /tmp/hls;
            hls_nested on;
            hls_fragment 1s;
            hls_playlist_length 8s;
            hls_fragment_naming system;
            hls_sync 100ms;
            hls_continuous on;
            hls_cleanup on;
            hls_type live;
        }
    }
}

http {
    include /opt/nginx/conf/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;

    # Only reachable inside the Docker network: Caddy proxies /hls/* here after
    # the app has approved the viewer, and the app itself uses /stat and /control.
    server {
        listen 8080;
        server_name _;

        location /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location /stat {
            rtmp_stat all;
        }

        location /control {
            rtmp_control all;
        }

        location /hls/ {
            root /tmp;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            autoindex off;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Origin, Range, Accept, Content-Type, X-Hls-Ticket' always;
            add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;

            location ~ \.m3u8$ {
                root /tmp;
                add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
                add_header Access-Control-Allow-Origin * always;
            }
            location ~ \.ts$ {
                root /tmp;
                add_header Cache-Control 'private, max-age=60' always;
                add_header Access-Control-Allow-Origin * always;
            }
        }
    }
}
