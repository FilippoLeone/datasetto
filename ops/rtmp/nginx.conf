# nginx-rtmp: OBS publishes to rtmps://HOST:1936/live/<channel>?key=<token> (TLS,
# see the stream block) or rtmp://HOST/live/<channel>?key=<token> (plain, LAN).
# nginx keeps <channel> as the stream name and posts key=<token> to the app
# (on_publish), so HLS is served from /hls/<channel>/index.m3u8 without the
# token ever appearing.
#
# Abuse limits: only the app may approve a publisher, nobody may pull RTMP, idle
# publishers are dropped, connections are capped, and the app polls /stat to drop
# publishers that exceed the configured bitrate or the monthly traffic budget.
worker_processes 1;
error_log /dev/stderr info;
pid /opt/nginx/logs/nginx.pid;

events {
    worker_connections 256;
}

rtmp {
    server {
        # Plain RTMP for the LAN, and the loopback port the RTMPS front (below)
        # forwards to; it prefixes each connection with a PROXY protocol header
        # so the publisher's real address reaches the logs and the app.
        listen 1935;
        listen 127.0.0.1:1945 proxy_protocol;
        chunk_size 4096;
        max_connections 32;
        max_streams 16;
        max_message 1M;
        timeout 30s;
        ping 30s;
        ping_timeout 10s;
        access_log /dev/stdout;

        application live {
            live on;
            interleave on;
            wait_key on;
            wait_video on;
            drop_idle_publisher 10s;
            idle_streams off;
            play_restart on;
            publish_notify on;
            record off;

            # Only the app decides who may publish; nobody may pull RTMP directly.
            allow publish all;
            deny play all;
            on_publish http://app:4000/internal/stream/publish;
            on_publish_done http://app:4000/internal/stream/done;

            hls on;
            hls_path /tmp/hls;
            hls_nested on;
            hls_fragment 1s;
            hls_playlist_length 8s;
            hls_fragment_naming system;
            hls_sync 100ms;
            hls_continuous on;
            hls_cleanup on;
            hls_type live;
        }
    }
}

# RTMPS: TLS is terminated here and the plain RTMP connection handed to the rtmp
# server over loopback (127.0.0.1:1945). The listener itself lives in
# /etc/nginx/rtmps/rtmps.conf, written by entrypoint.sh only when Caddy holds a
# certificate for SITE_ADDRESS. Without one this block stays empty: RTMPS is
# off and plain RTMP on 1935 keeps working.
stream {
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:rtmps:1m;
    ssl_session_timeout 1h;
    ssl_handshake_timeout 10s;
    proxy_connect_timeout 5s;
    # Longest silence tolerated on a connection. RTMP pings every 30 s, so a
    # vanished publisher is cut within a minute instead of the 10 minute default.
    proxy_timeout 60s;

    log_format rtmps '$remote_addr [$time_local] rtmps $status $ssl_protocol/$ssl_cipher '
                     'in=$bytes_received out=$bytes_sent ${session_time}s';
    access_log /dev/stdout rtmps;

    include /etc/nginx/rtmps/*.conf;
}

http {
    include /opt/nginx/conf/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;

    # Only reachable inside the Docker network: Caddy proxies /hls/* here after
    # the app has approved the viewer, and the app itself uses /stat and /control.
    server {
        listen 8080;
        server_name _;

        location /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location /stat {
            rtmp_stat all;
        }

        location /control {
            rtmp_control all;
        }

        location /hls/ {
            root /tmp;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            autoindex off;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Origin, Range, Accept, Content-Type, X-Hls-Ticket' always;
            add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;

            location ~ \.m3u8$ {
                root /tmp;
                add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
                add_header Access-Control-Allow-Origin * always;
            }
            location ~ \.ts$ {
                root /tmp;
                add_header Cache-Control 'private, max-age=60' always;
                add_header Access-Control-Allow-Origin * always;
            }
        }
    }
}
