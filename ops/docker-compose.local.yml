# Local overrides: plain HTTP on http://localhost:8080, permissive CORS for the
# Vite dev server, no TURN (same-machine peers connect directly).
#
#   docker compose -f ops/docker-compose.yml -f ops/docker-compose.local.yml up --build
services:
  web:
    ports: !override
      - "8080:80"
    environment:
      SITE_ADDRESS: ":80"
  app:
    environment:
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173
      LOG_LEVEL: ${LOG_LEVEL:-debug}
