name: Build container images

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'client/**'
      - 'ops/**'
      - '.github/workflows/images.yml'
  # A release rebuilds the images with its version baked into the web client, so a
  # redeploy after the release serves a bundle that knows which release it is.
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            context: .
            dockerfile: ops/caddy/Dockerfile
          - image: app
            context: server
            dockerfile: server/Dockerfile
          - image: rtmp
            context: ops/rtmp
            dockerfile: ops/rtmp/Dockerfile
          - image: turn
            context: ops/turn
            dockerfile: ops/turn/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags are needed to name the version of a branch build.
          fetch-depth: 0

      - name: Compute image name (GHCR requires lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/datasetto-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Compute the app version
        id: version
        run: |
          # The release tag, or for a branch build the newest tag reachable from the commit
          # plus the distance (v0.1.11-3-gabc123), which sorts below the next release.
          if [ -n "$RELEASE_TAG" ]; then
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION="$(git describe --tags --match 'v*' 2>/dev/null | sed 's/^v//')"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "app version: ${VERSION:-<none>}"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Always resolve the floating base tags (node:24-bookworm-slim) to their newest
          # digest; server/Dockerfile and ops/caddy/Dockerfile refuse a Node below the floor.
          pull: true
          platforms: linux/amd64
          # APK_REFRESH changes on every run, so the web and turn images re-run `apk upgrade`
          # instead of reusing a cached layer and pick up Alpine's newest security fixes.
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}
            APP_VERSION=${{ steps.version.outputs.version }}
            APK_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
